<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Casa IoT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef4f8;
  color: #243447;
}

header {
  background: #1685d1;
  color: white;
  text-align: center;
  padding: 25px 10px;
  border-radius: 15px;
  margin-bottom: 25px;
}

header h1 {
  margin: 0 0 10px;
}

.painel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  max-width: 1000px;
  margin: auto;
}

.cartao {
  background: white;
  border-radius: 15px;
  padding: 24px 15px;
  text-align: center;
  box-shadow: 0 4px 12px #00000012;
  border: 2px solid transparent;
}

.cartao.ativo {
  border-color: #21a675;
  background: #f0fff8;
}

.icone {
  font-size: 38px;
  margin-bottom: 10px;
}

h2 {
  font-size: 21px;
}

.estado {
  color: #53728b;
  font-weight: bold;
  margin: 15px 0;
}

button {
  background: #1685d1;
  color: white;
  border: none;
  padding: 11px 17px;
  margin: 4px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #0867aa;
}

.temperatura {
  font-size: 32px;
  font-weight: bold;
  color: #1685d1;
}

footer {
  text-align: center;
  margin-top: 28px;
  color: #607789;
}
</style>
</head>

<body>

<header>
  <h1>🏡 Minha Casa IoT</h1>
  <p>Painel de controle da casa inteligente</p>
</header>

<main class="painel">

<section class="cartao" id="cartaoLuz">
  <div class="icone">💡</div>
  <h2>Luz da sala</h2>
  <p class="estado" id="estadoLuz">Desligada</p>
  <button onclick="alternar('luz')">Ligar / Desligar</button>
</section>

<section class="cartao" id="cartaoVentilador">
  <div class="icone">🌀</div>
  <h2>Ventilador</h2>
  <p class="estado" id="estadoVentilador">Desligado</p>
  <button onclick="alternar('ventilador')">Ligar / Desligar</button>
</section>

<section class="cartao">
  <div class="icone">🌡️</div>
  <h2>Temperatura</h2>
  <p class="temperatura"><span id="graus">25</span> °C</p>
  <button onclick="mudarTemperatura(-1)">− Diminuir</button>
  <button onclick="mudarTemperatura(1)">+ Aumentar</button>
  <p class="estado">Temperatura simulada</p>
</section>

<section class="cartao" id="cartaoPorta">
  <div class="icone">🚪</div>
  <h2>Porta da casa</h2>
  <p class="estado" id="estadoPorta">Fechada</p>
  <button onclick="alternar('porta')">Abrir / Fechar</button>
</section>

<section class="cartao" id="cartaoAlarme">
  <div class="icone">🚨</div>
  <h2>Alarme</h2>
  <p class="estado" id="estadoAlarme">Desativado</p>
  <button onclick="alternar('alarme')">Ativar / Desativar</button>
</section>

</main>

<footer>
  <p>Projeto escolar de Internet das Coisas (IoT)</p>
  <p>Minha Casa IoT © 2026</p>
</footer>

<script>
let estados = {
  luz: false,
  ventilador: false,
  porta: false,
  alarme: false
};

let temperatura = 25;

function alternar(item) {
  estados[item] = !estados[item];

  const configuracoes = {
    luz: {
      elemento: "estadoLuz",
      ligado: "Ligada",
      desligado: "Desligada",
      cartao: "cartaoLuz"
    },
    ventilador: {
      elemento: "estadoVentilador",
      ligado: "Ligado",
      desligado: "Desligado",
      cartao: "cartaoVentilador"
    },
    porta: {
      elemento: "estadoPorta",
      ligado: "Aberta",
      desligado: "Fechada",
      cartao: "cartaoPorta"
    },
    alarme: {
      elemento: "estadoAlarme",
      ligado: "Ativado",
      desligado: "Desativado",
      cartao: "cartaoAlarme"
    }
  };

  const config = configuracoes[item];

  document.getElementById(config.elemento).textContent =
    estados[item] ? config.ligado : config.desligado;

  document.getElementById(config.cartao).classList.toggle(
    "ativo", estados[item]
  );
}

function mudarTemperatura(valor) {
  temperatura += valor;

  if (temperatura < 10) temperatura = 10;
  if (temperatura > 40) temperatura = 40;

  document.getElementById("graus").textContent = temperatura;
}
</script>

</body>
</html>
