<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Casa IoT</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef4f8;
  color: #243447;
}

header {
  background: #1685d1;
  color: white;
  text-align: center;
  padding: 25px 10px;
  border-radius: 15px;
  margin-bottom: 25px;
}

header h1 { margin: 0 0 10px; }

.painel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  max-width: 1000px;
  margin: auto;
}

.cartao {
  background: white;
  border-radius: 15px;
  padding: 24px 15px;
  text-align: center;
  box-shadow: 0 4px 12px #00000012;
  border: 2px solid transparent;
}

.cartao.ativo {
  border-color: #21a675;
  background: #f0fff8;
}

.icone { font-size: 38px; margin-bottom: 10px; }

h2 { font-size: 21px; }

.estado {
  color: #53728b;
  font-weight: bold;
  margin: 15px 0;
}

button {
  background: #1685d1;
  color: white;
  border: none;
  padding: 11px 17px;
  margin: 4px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:hover { background: #0867aa; }

.temperatura {
  font-size: 32px;
  font-weight: bold;
  color: #1685d1;
}

footer {
  text-align: center;
  margin-top: 28px;
  color: #607789;
}
</style>
</head>

<body>

<header>
  <h1>🏡 Minha Casa IoT</h1>
  <p>Painel de controle da casa inteligente</p>
</header>

<main class="painel">

<section class="cartao" id="cartaoLuz">
  <div class="icone">💡</div>
  <h2>Luz da sala</h2>
  <p class="estado" id="estadoLuz">Desligada</p>
  <button onclick="alternar('luz')">Ligar / Desligar</button>
</section>

<section class="cartao" id="cartaoVentilador">
  <div class="icone">🌀</div>
  <h2>Ventilador</h2>
  <p class="estado" id="estadoVentilador">Desligado</p>
  <button onclick="alternar('ventilador')">Ligar / Desligar</button>
</section>

<section class="cartao">
  <div class="icone">🌡️</div>
  <h2>Temperatura</h2>
  <p class="temperatura"><span id="graus">25</span> °C</p>
  <button onclick="mudarTemperatura(-1)">− Diminuir</button>
  <button onclick="mudarTemperatura(1)">+ Aumentar</button>
  <p class="estado">Temperatura simulada</p>
</section>

<section class="cartao" id="cartaoPorta">
  <div class="icone">🚪</div>
  <h2>Porta da casa</h2>
  <p class="estado" id="estadoPorta">Fechada</p>
  <button onclick="alternar('porta')">Abrir / Fechar</button>
</section>

<section class="cartao" id="cartaoAlarme">
  <div class="icone">🚨</div>
  <h2>Alarme</h2>
  <p class="estado" id="estadoAlarme">Desativado</p>
  <button onclick="alternar('alarme')">Ativar / Desativar</button>
</section>

</main>

<footer>
  <p>Projeto escolar de Internet das Coisas (IoT)</p>
  <p>Minha Casa IoT © 2026</p>
</footer>

<script>
const estadoInicial = {
  luz: false,
  ventilador: false,
  porta: false,
  alarme: false,
  temperatura: 25
};

let dados = { ...estadoInicial };

try {
  const salvo = localStorage.getItem("minhaCasaIoT");

  if (salvo) {
    const carregado = JSON.parse(salvo);

    if (carregado && typeof carregado === "object") {
      dados = {
        luz: typeof carregado.luz === "boolean" ? carregado.luz : false,
        ventilador: typeof carregado.ventilador === "boolean" ? carregado.ventilador : false,
        porta: typeof carregado.porta === "boolean" ? carregado.porta : false,
        alarme: typeof carregado.alarme === "boolean" ? carregado.alarme : false,
        temperatura: Number.isFinite(carregado.temperatura)
          ? Math.max(10, Math.min(40, carregado.temperatura))
          : 25
      };
    }
  }
} catch (erro) {
  dados = { ...estadoInicial };
}

function salvar() {
  try {
    localStorage.setItem("minhaCasaIoT", JSON.stringify(dados));
  } catch (erro) {
    console.log("Não foi possível salvar neste navegador.");
  }
}

function atualizarTela() {
  document.getElementById("estadoLuz").textContent =
    dados.luz ? "Ligada" : "Desligada";

  document.getElementById("estadoVentilador").textContent =
    dados.ventilador ? "Ligado" : "Desligado";

  document.getElementById("estadoPorta").textContent =
    dados.porta ? "Aberta" : "Fechada";

  document.getElementById("estadoAlarme").textContent =
    dados.alarme ? "Ativado" : "Desativado";

  document.getElementById("graus").textContent = dados.temperatura;

  document.getElementById("cartaoLuz").classList.toggle("ativo", dados.luz);
  document.getElementById("cartaoVentilador").classList.toggle("ativo", dados.ventilador);
  document.getElementById("cartaoPorta").classList.toggle("ativo", dados.porta);
  document.getElementById("cartaoAlarme").classList.toggle("ativo", dados.alarme);
}

function alternar(item) {
  dados[item] = !dados[item];
  atualizarTela();
  salvar();
}

function mudarTemperatura(valor) {
  dados.temperatura += valor;

  if (dados.temperatura < 10) dados.temperatura = 10;
  if (dados.temperatura > 40) dados.temperatura = 40;

  atualizarTela();
  salvar();
}

atualizarTela();
</script>

</body>
</html>
