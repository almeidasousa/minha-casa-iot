<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Casa IoT</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eef4f8;
    color: #243447;
    text-align: center;
    margin: 0;
    padding: 20px;
}
header {
    background: #176b87;
    color: white;
    padding: 20px;
    border-radius: 15px;
}
.painel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 24px auto;
}
.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 4px 12px #00000010;
}
.icone { font-size: 38px; }
.estado {
    font-weight: bold;
    color: #176b87;
}
button {
    background: #176b87;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 15px;
}
button:hover { background: #104e63; }
footer {
    margin-top: 20px;
    color: #526575;
}
</style>
</head>
<body>

<header>
    <h1>🏡 Minha Casa IoT</h1>
    <p>Painel de controle da casa inteligente</p>
</header>

<main class="painel">

<section class="card">
    <div class="icone">💡</div>
    <h2>Luz da sala</h2>
    <p class="estado" id="luz">Desligada</p>
    <button onclick="alternar('luz','Desligada','Ligada')">
        Ligar / Desligar
    </button>
</section>

<section class="card">
    <div class="icone">🌀</div>
    <h2>Ventilador</h2>
    <p class="estado" id="ventilador">Desligado</p>
    <button onclick="alternar('ventilador','Desligado','Ligado')">
        Ligar / Desligar
    </button>
</section>

<section class="card">
    <div class="icone">🌡️</div>
    <h2>Temperatura</h2>
    <p class="estado">25 °C</p>
    <p>Temperatura simulada</p>
</section>

<section class="card">
    <div class="icone">🚪</div>
    <h2>Porta da casa</h2>
    <p class="estado" id="porta">Fechada</p>
    <button onclick="alternar('porta','Fechada','Aberta')">
        Abrir / Fechar
    </button>
</section>

<section class="card">
    <div class="icone">🚨</div>
    <h2>Alarme</h2>
    <p class="estado" id="alarme">Desativado</p>
    <button onclick="alternar('alarme','Desativado','Ativado')">
        Ativar / Desativar
    </button>
</section>

</main>

<footer>
    <p>Projeto acadêmico de Internet das Coisas (IoT)</p>
    <p>Minha Casa IoT © 2026</p>
</footer>

<script>
function alternar(id, estadoInicial, estadoAlternativo) {
    const elemento = document.getElementById(id);

    if (elemento.textContent === estadoInicial) {
        elemento.textContent = estadoAlternativo;
    } else {
        elemento.textContent = estadoInicial;
    }
}
</script>

</body>
</html>
